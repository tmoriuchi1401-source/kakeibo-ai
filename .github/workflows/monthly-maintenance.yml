name: Monthly backup and receipt retention
on:
  workflow_dispatch:
  schedule:
    - cron: '37 18 1 * *'

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PROCESSED_DRIVE_FOLDER_ID: ${{ secrets.PROCESSED_DRIVE_FOLDER_ID }}
      BACKUP_DRIVE_FOLDER_ID: ${{ secrets.BACKUP_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_BACKUP_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_BACKUP_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Back up spreadsheet
        if: ${{ env.SPREADSHEET_ID != '' && env.BACKUP_DRIVE_FOLDER_ID != '' && env.GOOGLE_DRIVE_BACKUP_TOKEN_JSON != '' }}
        run: python -m app.cli backup
      - name: Permanently delete processed receipts older than one year
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && env.PROCESSED_DRIVE_FOLDER_ID != '' }}
        run: python -m app.cli receipts-cleanup
