name: Gemini synthetic availability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kakeibo-production
  cancel-in-progress: false
  queue: max

jobs:
  probe:
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.ref == 'refs/heads/main' &&
      vars.KAKEIBO_PRODUCTION_ENABLED == 'true' &&
      github.sha == vars.KAKEIBO_VALIDATED_MAIN_SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed diagnostic dependencies
        run: python -m pip install google-genai==2.24.0 Pillow==11.3.0
      - name: Compare fixed synthetic text and image requests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m app.gemini_probe
