name: iPhone Phase 5B-2A synthetic owner acknowledgement

on:
  pull_request:
    branches: [codex/phase5b1-draft-foundation]

permissions:
  contents: read

env:
  UNIFIED_RECEIPT_WRITE_ENABLED: 'false'

concurrency:
  group: kakeibo-iphone-phase5b2a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acknowledgement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: pip install -r requirements-test.txt
      - name: Collect and execute synthetic acknowledgement contracts
        run: |
          python -m pytest --collect-only -q tests/test_iphone_confirmation.py
          python -m pytest -vv tests/test_iphone_confirmation.py
      - name: Reuse Phase 5B-1 and native safety boundaries
        run: python -m pytest -q tests/test_iphone_persistent_drafts.py tests/test_iphone_source_observation.py tests/test_iphone_item_drafts.py tests/test_iphone_phase5b1_host.py tests/test_iphone_readonly_host.py tests/test_iphone_sheet_reader.py tests/test_iphone_draft_journal.py tests/test_iphone_native_dry_run.py tests/test_iphone_review_drafts.py tests/test_iphone_review_preview.py tests/test_unified_receipt_review.py tests/test_unified_receipt_eligibility.py tests/test_unified_receipt_write.py tests/test_unified_receipt_purposes.py tests/test_unified_receipt_shadow_host.py tests/test_production_workflows.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/phase5b2a-browser" playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/phase5b2a-browsers" "$RUNNER_TEMP/phase5b2a-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify PC and 390px synthetic interactions without live network
        run: |
          python tests/iphone_confirmation_visual.py --output .private/phase5b2a-visual
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/phase5b2a-browsers" KAKEIBO_PLAYWRIGHT="$RUNNER_TEMP/phase5b2a-browser/node_modules/playwright" node tests/iphone_confirmation_browser.cjs .private/phase5b2a-visual
      - name: Compile and check whitespace
        run: |
          python -m compileall -q app/iphone_confirmation.py app/iphone_confirmation_host.py app/iphone_persistent_drafts.py tests/iphone_confirmation_fixtures.py tests/iphone_confirmation_visual.py tests/test_iphone_confirmation.py
          git diff --check
