name: Category sheet request
run-name: Category request ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID of the immutable request held in the management spreadsheet
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/feat/receipt-') && 'receipt-synthetic-validation' || 'kakeibo-production' }}
  cancel-in-progress: false
  queue: max
jobs:
  receipt-validation:
    # The registered main workflow can select this pinned feature-branch ref.
    # Production/category execution below remains main-only and unchanged.
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.ref == format('refs/heads/{0}', vars.RECEIPT_VALIDATION_REF) &&
      startsWith(vars.RECEIPT_VALIDATION_REF, 'feat/receipt-') &&
      github.sha == vars.RECEIPT_VALIDATION_SHA &&
      github.run_attempt == 1 &&
      vars.RECEIPT_VALIDATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RECEIPT_VALIDATION_ENABLED: ${{ vars.RECEIPT_VALIDATION_ENABLED }}
      RECEIPT_VALIDATION_REF: ${{ vars.RECEIPT_VALIDATION_REF }}
      RECEIPT_VALIDATION_SHA: ${{ vars.RECEIPT_VALIDATION_SHA }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify approved checkout before private inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RECEIPT_VALIDATION_SHA"
          test "$GITHUB_SHA" = "$RECEIPT_VALIDATION_SHA"
      - name: Require normal logging before private inputs
        if: ${{ runner.debug == '1' }}
        run: exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate one captured general receipt without posting
        env:
          RECEIPT_REQUEST_ID: ${{ inputs.request_id }}
          RECEIPT_VALIDATION_CONFIG_JSON: ${{ secrets.RECEIPT_VALIDATION_CONFIG_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m app.receipt_sheet_worker
  category-request:
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.ref == 'refs/heads/main' &&
      vars.KAKEIBO_PRODUCTION_ENABLED == 'true' &&
      vars.KAKEIBO_LEGACY_DISABLED == 'true' &&
      github.sha == vars.KAKEIBO_VALIDATED_MAIN_SHA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAKEIBO_PRODUCTION_ENABLED: ${{ vars.KAKEIBO_PRODUCTION_ENABLED }}
      KAKEIBO_LEGACY_DISABLED: ${{ vars.KAKEIBO_LEGACY_DISABLED }}
      KAKEIBO_VALIDATED_MAIN_SHA: ${{ vars.KAKEIBO_VALIDATED_MAIN_SHA }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      KAKEIBO_PROJECTION_FOLDER_ID: ${{ vars.KAKEIBO_PROJECTION_FOLDER_ID }}
      KAKEIBO_DAILY_SPREADSHEET_ID: ${{ vars.KAKEIBO_DAILY_SPREADSHEET_ID }}
      KAKEIBO_DAILY_CORRECTIONS_MODE: ${{ vars.KAKEIBO_DAILY_CORRECTIONS_MODE }}
      CATEGORY_RULE_UI_ENABLED: ${{ vars.CATEGORY_RULE_UI_ENABLED }}
      CATEGORY_RULE_SAVE_ENABLED: ${{ vars.CATEGORY_RULE_SAVE_ENABLED }}
      CATEGORY_BACKFILL_PREVIEW_ENABLED: ${{ vars.CATEGORY_BACKFILL_PREVIEW_ENABLED }}
      CATEGORY_BACKFILL_APPLY_ENABLED: ${{ vars.CATEGORY_BACKFILL_APPLY_ENABLED }}
      BANK_REVIEW_ENABLED: ${{ vars.BANK_REVIEW_ENABLED }}
      BANK_REVIEW_REPLAY_ENABLED: ${{ vars.BANK_REVIEW_REPLAY_ENABLED || 'false' }}
      BANK_PDF_DRIVE_FOLDER_ID: ${{ secrets.BANK_PDF_DRIVE_FOLDER_ID }}
      BANK_PDF_PROCESSED_DRIVE_FOLDER_ID: ${{ vars.BANK_PDF_PROCESSED_DRIVE_FOLDER_ID }}
      BANK_PDF_RECURRING_AUTHORITY_JSON: ${{ secrets.BANK_PDF_RECURRING_AUTHORITY_JSON }}
      BANK_INCOME_WRITE_ENABLED: ${{ vars.BANK_INCOME_WRITE_ENABLED || 'false' }}
      BANK_AUDIT_KEY_JSON: ${{ secrets.BANK_AUDIT_KEY_JSON }}
      KAKEIBO_STATE_FOLDER_ID: ${{ vars.KAKEIBO_STATE_FOLDER_ID }}
      AMAZON_STATE_FILE_ID: ${{ vars.AMAZON_STATE_FILE_ID }}
      AUPAY_CARD_STATE_FILE_ID: ${{ vars.AUPAY_CARD_STATE_FILE_ID }}
      BANK_STATE_FILE_ID: ${{ vars.BANK_STATE_FILE_ID }}
      KAKEIBO_RUN_LEDGER_FILE_ID: ${{ vars.KAKEIBO_RUN_LEDGER_FILE_ID }}
      BANK_CONFIRMED_INTERNAL_TRANSFERS_JSON: ${{ secrets.BANK_CONFIRMED_INTERNAL_TRANSFERS_JSON }}
      BANK_CONFIRMED_NON_OWN_CLASSIFICATIONS_JSON: ${{ secrets.BANK_CONFIRMED_NON_OWN_CLASSIFICATIONS_JSON }}
      BANK_CONFIRMED_DOCOMO_SMTB_RULES_JSON: ${{ secrets.BANK_CONFIRMED_DOCOMO_SMTB_RULES_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Bind verified checkout for existing bank main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KAKEIBO_VALIDATED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git switch -C main "$GITHUB_SHA"
          git branch --set-upstream-to=origin/main main
      - name: Require normal logging before private inputs
        if: ${{ runner.debug == '1' }}
        run: exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Process captured category input and refresh displays
        env:
          CATEGORY_REQUEST_ID: ${{ inputs.request_id }}
        run: python -m app.category_sheet_requests
