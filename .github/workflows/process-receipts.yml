name: Process receipt inbox
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_GMAIL_TOKEN_JSON: ${{ secrets.GOOGLE_GMAIL_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Process Google Drive receipt inbox
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RECEIPT_DRIVE_FOLDER_ID: ${{ secrets.RECEIPT_DRIVE_FOLDER_ID }}
          PROCESSED_DRIVE_FOLDER_ID: ${{ secrets.PROCESSED_DRIVE_FOLDER_ID }}
        run: python -m app.cli drive-receipts
      - name: Import au PAY notices from Gmail
        if: ${{ env.GOOGLE_GMAIL_TOKEN_JSON != '' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AUPAY_GMAIL_QUERY: ${{ vars.AUPAY_GMAIL_QUERY }}
        run: python -m app.cli aupay-gmail
