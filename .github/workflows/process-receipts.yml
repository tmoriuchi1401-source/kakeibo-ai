name: Process receipt inbox
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      RECEIPT_DRIVE_FOLDER_ID: ${{ secrets.RECEIPT_DRIVE_FOLDER_ID }}
      PAYPAY_DRIVE_FOLDER_ID: ${{ secrets.PAYPAY_DRIVE_FOLDER_ID }}
      PROCESSED_DRIVE_FOLDER_ID: ${{ secrets.PROCESSED_DRIVE_FOLDER_ID }}
      GOOGLE_GMAIL_TOKEN_JSON: ${{ secrets.GOOGLE_GMAIL_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install local Japanese OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
          tesseract --list-langs 2>/dev/null | grep -qx jpn
      - run: pip install -r requirements.txt
      - name: Show configured integrations
        run: |
          test -n "$GEMINI_API_KEY" && echo "Gemini: configured" || echo "Gemini: not configured"
          test -n "$SPREADSHEET_ID" && echo "Sheets: configured" || echo "Sheets: not configured"
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" && echo "Google service account: configured" || echo "Google service account: not configured"
          test -n "$RECEIPT_DRIVE_FOLDER_ID" && echo "Receipt Drive folder: configured" || echo "Receipt Drive folder: not configured"
          test -n "$PAYPAY_DRIVE_FOLDER_ID" && echo "PayPay Drive folder: configured" || echo "PayPay Drive folder: not configured"
          test -n "$GOOGLE_GMAIL_TOKEN_JSON" && echo "Gmail: configured" || echo "Gmail: not configured"
      - name: Import au PAY notices from Gmail
        if: ${{ env.GOOGLE_GMAIL_TOKEN_JSON != '' && env.SPREADSHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          AUPAY_GMAIL_QUERY: ${{ vars.AUPAY_GMAIL_QUERY }}
        run: python -m app.cli aupay-gmail
      - name: Process Google Drive receipt inbox
        if: ${{ env.GEMINI_API_KEY != '' && env.SPREADSHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && env.RECEIPT_DRIVE_FOLDER_ID != '' }}
        env:
          GEMINI_MODEL: gemini-3.6-flash
        run: python -m app.cli drive-receipts
      - name: Apply mobile review decisions
        if: ${{ always() && env.SPREADSHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: python -m app.cli review-apply
      - name: Import PayPay CSV files from Google Drive
        if: ${{ env.PAYPAY_DRIVE_FOLDER_ID != '' && env.SPREADSHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: python -m app.cli drive-paypay
      - name: Reconcile imported transactions
        if: ${{ always() && env.SPREADSHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: python -m app.cli reconcile
      - name: Auto-post clear payment transactions
        if: ${{ always() && env.SPREADSHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: python -m app.cli auto-expense
      - name: Refresh mobile review sheet
        if: ${{ always() && env.SPREADSHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: python -m app.cli review-refresh
      - name: Refresh active expense view
        if: ${{ always() && env.SPREADSHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: python -m app.cli expenses-refresh
