name: Google runner read-only preflight
on:
  pull_request:
    branches: [codex/persistent-runner-cas-checkpoint]
permissions:
  contents: read
env:
  UNIFIED_RECEIPT_WRITE_ENABLED: 'false'
concurrency:
  group: kakeibo-google-runner-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install synthetic verification dependencies
        run: |
          pip install -r requirements-test.txt formulas==1.3.4
      - name: Offline runner with blocked egress
        run: |
          for tool in unshare ip runuser sudo; do command -v "$tool" >/dev/null; done
          task_user=$(id -un)
          task_python=$(command -v python)
          task_netns=$(readlink /proc/self/ns/net)
          sudo unshare --net -- sh -eu -c '
            ip link set lo up
            exec runuser -u "$1" -- env REGISTRATION_OUTER_NETNS="$3" UNIFIED_RECEIPT_WRITE_ENABLED=false "$2" -m pytest -q tests/test_registration_runner.py tests/test_registration_runner_ci.py tests/test_persistent_registration.py tests/test_persistent_drive_slots.py tests/test_persistent_runner_ci.py tests/test_google_runner_preflight.py tests/test_google_runner_preflight_ci.py --junitxml=.private/offline-runner.xml
          ' sh "$task_user" "$task_python" "$task_netns"
      - name: Live boundary contracts without Google credentials
        run: python -m pytest -q tests/test_live_synthetic_sheets.py tests/test_live_sheets_ci.py tests/test_sheets_registration.py tests/test_registration_ci.py tests/test_sheets_only_review.py tests/test_sheets_only_ci.py --junitxml=.private/live-sheets-core.xml
      - name: Existing reader journal adapter host and input regressions
        run: python -m pytest -q tests/test_synthetic_draft_writer.py tests/test_manual_entry.py tests/test_bank_finalization.py tests/test_paypay_pipeline.py tests/test_amazon_money.py tests/test_receipt_pipeline.py tests/test_iphone_sheet_handoff.py tests/test_iphone_sheet_handoff_host.py tests/test_iphone_handoff_ui.py tests/test_iphone_sheet_reader.py tests/test_iphone_draft_journal.py tests/test_iphone_persistent_drafts.py tests/test_iphone_source_observation.py tests/test_iphone_item_drafts.py tests/test_iphone_review_drafts.py tests/test_iphone_confirmation.py tests/test_production_workflows.py tests/test_iphone_r1_adapter.py::test_save_returns_exact_readback_revision_tag_and_replay_metadata tests/test_iphone_r1_confirmation.py::test_partial_save_and_medical_origin_block tests/test_iphone_r1_confirmation.py::test_holds_have_no_qualification --junitxml=.private/live-sheets-regression.xml
      - name: Compile preserved scripts and whitespace
        run: |
          python -m compileall -q staging_shadow/google_runner_preflight.py tests/test_google_runner_preflight.py tests/test_google_runner_preflight_ci.py staging_shadow/persistent_registration.py tests/persistent_runner_worker.py tests/test_persistent_registration.py tests/test_persistent_drive_slots.py tests/test_persistent_runner_ci.py staging_shadow/registration_runner.py tests/offline_registration_runner.py tests/test_registration_runner.py tests/test_registration_runner_ci.py staging_shadow/live_synthetic_sheets.py tests/live_google_sheets_probe.py tests/test_live_synthetic_sheets.py tests/test_live_sheets_ci.py staging_shadow/standing_permission.py staging_shadow/sheets_registration.py staging_shadow/sheets_only_review.py staging_shadow/sheets_only_surface.py tests/registration_fixtures.py tests/sheets_only_fixtures.py tests/test_sheets_registration.py tests/test_registration_ci.py tests/test_registration_visual.py tests/test_sheets_only_review.py tests/test_sheets_only_ci.py tests/test_sheets_only_visual.py
          node --check app/unified_shadow_templates/iphone_sheet_handoff.js
          git diff --check ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          git diff --exit-code ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- app/unified_shadow_templates tests/test_registration_visual.py tests/test_sheets_only_visual.py tests/test_iphone_handoff_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-runner-preflight-synthetic-evidence
          path: |
            .private/offline-runner.xml
            .private/live-sheets-*.xml
          include-hidden-files: true
          retention-days: 7
