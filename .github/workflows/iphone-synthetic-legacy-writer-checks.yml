name: iPhone synthetic legacy confirmation writer

on:
  pull_request:
    branches: [codex/phase5b2b2c2-isolated-native-v2]

permissions:
  contents: read

env:
  UNIFIED_RECEIPT_WRITE_ENABLED: 'false'

concurrency:
  group: kakeibo-iphone-legacy-writer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: pip install -r requirements-test.txt
      - name: Collect and execute guarded legacy writer
        run: |
          python -m pytest --collect-only -q tests/test_synthetic_legacy_writer.py
          python -m pytest -vv tests/test_synthetic_legacy_writer.py
      - name: Collect and execute isolated native v2
        run: |
          python -m pytest --collect-only -q tests/test_receipt_confirmation_contract.py
          python -m pytest -vv tests/test_receipt_confirmation_contract.py
      - name: Collect and execute contract PoC
        run: |
          python -m pytest --collect-only -q tests/test_legacy_contract_poc.py
          python -m pytest -vv tests/test_legacy_contract_poc.py
      - name: Collect and execute legacy stopping evidence
        run: |
          python -m pytest --collect-only -q tests/test_legacy_confirmation_connection_stop.py
          python -m pytest -vv tests/test_legacy_confirmation_connection_stop.py
      - name: Collect and execute native evidence and existing writer tests
        run: |
          python -m pytest --collect-only -q tests/test_auto_native_evidence.py tests/test_synthetic_existing_writer.py
          python -m pytest -vv tests/test_auto_native_evidence.py tests/test_synthetic_existing_writer.py
      - name: Reuse existing safety and native-writer regressions
        run: python -m pytest -q tests/test_iphone_confirmation.py tests/test_iphone_persistent_drafts.py tests/test_iphone_source_observation.py tests/test_iphone_item_drafts.py tests/test_iphone_phase5b1_host.py tests/test_iphone_readonly_host.py tests/test_iphone_sheet_reader.py tests/test_iphone_draft_journal.py tests/test_iphone_native_dry_run.py tests/test_iphone_review_drafts.py tests/test_iphone_review_preview.py tests/test_unified_receipt_review.py tests/test_unified_receipt_eligibility.py tests/test_unified_receipt_write.py tests/test_unified_receipt_purposes.py tests/test_unified_receipt_shadow_host.py tests/test_production_workflows.py tests/test_native_ingress_safety_stop.py tests/test_p14_plan_only.py tests/test_receipt_unit_plan.py tests/test_receipt_unit_posting.py tests/test_p14_posting.py tests/test_receipt_pipeline.py tests/test_receipt_confirmation.py tests/test_pdf_intake_runner.py tests/test_receipt_privacy_gate.py tests/test_receipt_text_extraction.py tests/test_accounting_ownership.py tests/test_accounting_enforced_gate.py tests/test_accounting_recovery.py tests/test_receipt_reimport_production.py
      - name: Compile and check whitespace
        run: |
          python -m compileall -q staging_shadow/auto_native_evidence.py staging_shadow/synthetic_auto_writer.py tests/auto_native_fixtures.py tests/test_auto_native_evidence.py tests/test_synthetic_existing_writer.py tests/test_legacy_confirmation_connection_stop.py staging_shadow/legacy_contract_poc.py tests/test_legacy_contract_poc.py app/receipt_confirmation_contract.py app/receipt_reimport_production.py tests/test_receipt_confirmation_contract.py staging_shadow/synthetic_legacy_writer.py tests/test_synthetic_legacy_writer.py
          git diff --check
