name: Export Amazon unmatched diagnostics

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Export anonymized diagnostic input
        run: python -m app.cli amazon-unmatched-export --output amazon-unmatched-input.json
      - name: Upload anonymized diagnostic input
        uses: actions/upload-artifact@v4
        with:
          name: amazon-unmatched-input
          path: amazon-unmatched-input.json
          retention-days: 1
          if-no-files-found: error
