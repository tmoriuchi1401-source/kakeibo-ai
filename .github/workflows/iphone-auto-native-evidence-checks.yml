name: iPhone synthetic auto native execution evidence

on:
  pull_request:
    branches: [codex/phase5b2b1-step-c-recovery]

permissions:
  contents: read

env:
  UNIFIED_RECEIPT_WRITE_ENABLED: 'false'

concurrency:
  group: kakeibo-iphone-auto-native-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-native-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: pip install -r requirements-test.txt
      - name: Collect and execute synthetic auto native evidence
        run: |
          python -m pytest --collect-only -q tests/test_auto_native_evidence.py
          python -m pytest -vv tests/test_auto_native_evidence.py
      - name: Reuse existing safety regressions and native validators
        run: python -m pytest -q tests/test_iphone_confirmation.py tests/test_iphone_persistent_drafts.py tests/test_iphone_source_observation.py tests/test_iphone_item_drafts.py tests/test_iphone_phase5b1_host.py tests/test_iphone_readonly_host.py tests/test_iphone_sheet_reader.py tests/test_iphone_draft_journal.py tests/test_iphone_native_dry_run.py tests/test_iphone_review_drafts.py tests/test_iphone_review_preview.py tests/test_unified_receipt_review.py tests/test_unified_receipt_eligibility.py tests/test_unified_receipt_write.py tests/test_unified_receipt_purposes.py tests/test_unified_receipt_shadow_host.py tests/test_production_workflows.py tests/test_native_ingress_safety_stop.py tests/test_p14_plan_only.py tests/test_receipt_unit_plan.py tests/test_receipt_unit_posting.py tests/test_p14_posting.py tests/test_receipt_pipeline.py tests/test_receipt_confirmation.py tests/test_pdf_intake_runner.py tests/test_receipt_privacy_gate.py tests/test_receipt_text_extraction.py tests/test_accounting_ownership.py tests/test_accounting_enforced_gate.py tests/test_accounting_recovery.py
      - name: Compile and check whitespace
        run: |
          python -m compileall -q staging_shadow/auto_native_evidence.py tests/auto_native_fixtures.py tests/test_auto_native_evidence.py
          git diff --check
