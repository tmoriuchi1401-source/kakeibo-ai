name: Card alias differential checks

on:
  pull_request:
    branches: [main, codex/issue-207-hosted-receipts]
    paths:
      - app/aupay_card_*.py
      - app/transaction_plan.py
      - app/cli.py
      - tests/test_aupay_card_*.py
      - tests/test_transaction_plan.py
      - .github/workflows/card-alias-delta.yml

permissions:
  contents: read

concurrency:
  group: card-alias-delta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - name: Network-denied card, persistence and guard regressions
        run: >-
          python -m pytest -q --tb=short
          tests/test_transaction_plan.py tests/test_aupay_card_apply_plan.py
          tests/test_aupay_card_aliases.py tests/test_aupay_card_checkpoint_reconciliation.py
          tests/test_aupay_card_recurring.py tests/test_aupay_card_first_window_apply.py
          tests/test_aupay_card_incremental_apply.py tests/test_aupay_card_incremental_recovery.py
          tests/test_aupay_card_window_preview.py tests/test_aupay_card_batch.py
          tests/test_drive_run_state.py tests/test_production_flow.py tests/test_architecture_contract.py
      - name: Compile and whitespace
        run: |
          python -m compileall -q app tests
          git diff --check
