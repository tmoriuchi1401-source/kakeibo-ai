name: Synthetic integration checks

on:
  push:
    branches: [main, integration/production-orchestration-20260915]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kakeibo-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-ocr-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAKEIBO_OCR_MODEL_DIR: /tmp/kakeibo-ocr-models
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned public models and offline pixel processing
        run: |
          pip install -r requirements.txt -r requirements-local-ocr.txt
          python -m app.receipt_local_ocr prepare
          python - <<'PY'
          import socket
          from PIL import Image
          from app.receipt_local_ocr import read_tokens
          def deny(*args, **kwargs):
              raise AssertionError('OCR runtime must be offline')
          socket.socket.connect = deny
          socket.create_connection = deny
          assert read_tokens(Image.new('RGB', (300, 200), 'white')) == []
          PY
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: general
            selection: not payroll and not medical
          - suite: sensitive-synthetic
            selection: payroll or medical
    # Both jobs receive only synthetic fixtures and no production/AI Secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-jpn
      - name: Run isolated synthetic suite
        env:
          TEST_SELECTION: ${{ matrix.selection }}
        run: python -m pytest -q --tb=short -k "$TEST_SELECTION"
      - name: Check final cache run selection without credentials
        run: node --test .github/scripts/verify-state-cache-runs.test.cjs
      - name: Compile and check whitespace
        run: |
          python -m compileall -q app tests
          git diff --check
