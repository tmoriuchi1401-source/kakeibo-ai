name: iPhone Phase 5A synthetic readonly host

on:
  pull_request:
    branches: [codex/iphone-raw-draft-adapter]

permissions:
  contents: read

env:
  UNIFIED_RECEIPT_WRITE_ENABLED: 'false'

concurrency:
  group: kakeibo-iphone-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readonly-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: pip install -r requirements-test.txt
      - name: Collect and execute authenticated read-only host contracts
        run: |
          python -m pytest --collect-only -q tests/test_iphone_readonly_host.py
          python -m pytest -vv tests/test_iphone_readonly_host.py
      - name: Reuse Phase 4B and native safety boundaries
        run: python -m pytest -q tests/test_iphone_sheet_reader.py tests/test_iphone_draft_journal.py tests/test_iphone_native_dry_run.py tests/test_iphone_review_drafts.py tests/test_iphone_review_preview.py tests/test_unified_receipt_review.py tests/test_unified_receipt_eligibility.py tests/test_unified_receipt_write.py tests/test_unified_receipt_purposes.py tests/test_unified_receipt_shadow_host.py tests/test_production_workflows.py
      - name: Compile and check whitespace
        run: |
          python -m compileall -q app/iphone_readonly_host.py tests/iphone_readonly_fixtures.py tests/test_iphone_readonly_host.py tests/iphone_readonly_visual.py
          git diff --check
