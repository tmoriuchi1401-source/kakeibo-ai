name: One-time au PAY card authority read-only inspection

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact commit approved for one diagnostic dispatch
        required: true
        type: string
      confirm:
        description: READ_ONLY after reviewing this exact commit
        required: true
        type: choice
        options: [READ_ONLY]

permissions:
  contents: read
  actions: read

concurrency:
  group: kakeibo-production
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/review/aupay-authority-readonly-20261031' &&
      github.sha == inputs.reviewed_commit &&
      github.workflow_sha == inputs.reviewed_commit &&
      inputs.confirm == 'READ_ONLY' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 &&
      vars.KAKEIBO_PRODUCTION_ENABLED == 'true' &&
      vars.KAKEIBO_VALIDATED_MAIN_SHA == '62a7503878a4947a66f1e0ca12485e36c8f1962d' &&
      vars.KAKEIBO_BANK_SCHEDULE_ENABLED == 'true' &&
      vars.KAKEIBO_SCHEDULE_ENABLED == 'false' &&
      vars.CATEGORY_BACKFILL_SHEET_RUNNER_ENABLED == 'false' &&
      vars.KAKEIBO_LEGACY_DISABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.reviewed_commit }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify only the diagnostic workflow differs from validated main
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          DEBUG_ENABLED: ${{ runner.debug }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test "$DEBUG_ENABLED" != '1'
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          git merge-base --is-ancestor 62a7503878a4947a66f1e0ca12485e36c8f1962d HEAD
          test "$(git diff --name-only 62a7503878a4947a66f1e0ca12485e36c8f1962d HEAD)" = '.github/workflows/bank-apply-readonly-inspect.yml'
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
          architecture: x64
          check-latest: false
      - name: Materialize reviewed diagnostic and complete dependency lock
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/card-authority-readonly.py" <<'PY'
          """Review-only source; embedded verbatim in the proposed manual workflow."""
          import base64, contextlib, hashlib, io, json, math, os, re, signal, sqlite3, sys, tempfile, time
          import urllib.parse as urlparse
          import urllib.request as urlrequest
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from types import SimpleNamespace

          BASE = '62a7503878a4947a66f1e0ca12485e36c8f1962d'
          REPO = 'tmoriuchi1401-source/kakeibo-ai'
          WORKFLOW = 'bank-apply-readonly-inspect.yml'
          PREFIX = f'https://api.github.com/repos/{REPO}/'
          FAILURES = frozenset('environment_invalid http_failed http_redirect_forbidden http_request_forbidden http_size_limit request_limit main_mismatch competing_run already_attempted authority_json_invalid worksheet_mismatch window_stride_invalid authority_policy_invalid source_mismatch spreadsheet_mismatch authority_period_inactive state_binding_invalid state_pending native_pending checkpoint_invalid state_changed target_worksheet_missing timeout inspection_failed'.split())

          class Stop(Exception):
              pass

          def require(condition, reason):
              if not condition:
                  raise Stop(reason)

          class NoRedirect(urlrequest.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise Stop('http_redirect_forbidden')

          class ReadNetwork:
              """No discovery, proxies, redirects, pagination loops, retries or general write API."""
              def __init__(self):
                  self.opener = urlrequest.build_opener(urlrequest.ProxyHandler({}), NoRedirect())
                  self.allowed = set()
                  self.calls = 0
                  self.token = ''

              def request(self, method, url, token='', data=None):
                  require((method, url) in self.allowed, 'http_request_forbidden')
                  self.calls += 1
                  require(self.calls <= 40, 'request_limit')
                  headers = {'Accept': 'application/json', 'User-Agent': 'kakeibo-card-authority-readonly'}
                  if token:
                      headers['Authorization'] = 'Bearer ' + token
                  if data is not None:
                      headers['Content-Type'] = 'application/x-www-form-urlencoded'
                  try:
                      req = urlrequest.Request(url, data=data, headers=headers, method=method)
                      with self.opener.open(req, timeout=15) as response:
                          require(response.status == 200, 'http_failed')
                          result = response.read(64 * 1024 * 1024 + 1)
                      require(len(result) <= 64 * 1024 * 1024, 'http_size_limit')
                      return result
                  except Stop:
                      raise
                  except Exception:
                      raise Stop('http_failed') from None

              def json(self, method, url, token='', data=None):
                  return json.loads(self.request(method, url, token, data))

              def controls(self):
                  sha, rid = os.environ['REVIEWED_COMMIT'], int(os.environ['CURRENT_RUN_ID'])
                  require(re.fullmatch('[0-9a-f]{40}', sha) is not None and rid > 0, 'environment_invalid')
                  urls = [PREFIX + 'branches/main', PREFIX + f'actions/workflows/{WORKFLOW}/runs?head_sha={sha}&event=workflow_dispatch&per_page=100']
                  urls += [PREFIX + f'actions/runs?status={s}&per_page=100' for s in ('in_progress','queued','waiting','pending','requested')]
                  self.allowed.update(('GET', u) for u in urls)
                  token = os.environ['GH_TOKEN']
                  require(self.json('GET', urls[0], token)['commit']['sha'] == BASE, 'main_mismatch')
                  runs = self.json('GET', urls[1], token)
                  require(runs['total_count'] == 1 and len(runs['workflow_runs']) == 1 and runs['workflow_runs'][0]['id'] == rid and runs['workflow_runs'][0]['run_attempt'] == 1, 'already_attempted')
                  for url in urls[2:]:
                      page = self.json('GET', url, token)
                      require(page['total_count'] <= 100 and all(r['id'] == rid for r in page['workflow_runs']), 'competing_run')

              def google(self, info, spreadsheet, ids):
                  from cryptography.hazmat.primitives import hashes, serialization
                  from cryptography.hazmat.primitives.asymmetric import padding
                  self.oauth = 'https://oauth2.googleapis.com/token'
                  self.allowed.add(('POST', self.oauth))
                  for fid in ids:
                      require(re.fullmatch('[A-Za-z0-9_-]{10,150}', fid) is not None, 'state_binding_invalid')
                      base = 'https://www.googleapis.com/drive/v3/files/' + fid
                      self.allowed.add(('GET', base + '?supportsAllDrives=true&fields=id,parents,trashed,mimeType,version,md5Checksum,size'))
                      self.allowed.add(('GET', base + '?supportsAllDrives=true&alt=media'))
                  require(re.fullmatch('[A-Za-z0-9_-]{10,150}', spreadsheet) is not None, 'state_binding_invalid')
                  self.sheet_url = 'https://sheets.googleapis.com/v4/spreadsheets/' + spreadsheet + '?fields=sheets(properties(title))'
                  self.allowed.add(('GET', self.sheet_url))
                  def b64(value):
                      return base64.urlsafe_b64encode(value).rstrip(b'=')
                  stamp = int(time.time())
                  claims = dict(iss=info['client_email'], scope='https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/spreadsheets.readonly', aud=self.oauth, iat=stamp, exp=stamp+300)
                  unsigned = b64(b'{"alg":"RS256","typ":"JWT"}') + b'.' + b64(json.dumps(claims,separators=(',',':')).encode())
                  key = serialization.load_pem_private_key(info['private_key'].encode(), password=None)
                  signed = unsigned + b'.' + b64(key.sign(unsigned,padding.PKCS1v15(),hashes.SHA256()))
                  body = urlparse.urlencode(dict(grant_type='urn:ietf:params:oauth:grant-type:jwt-bearer',assertion=signed.decode())).encode()
                  self.token = self.json('POST', self.oauth, data=body)['access_token']

              def state(self, binding, validator):
                  base = 'https://www.googleapis.com/drive/v3/files/' + binding.file_id
                  meta = self.json('GET', base + '?supportsAllDrives=true&fields=id,parents,trashed,mimeType,version,md5Checksum,size', self.token)
                  require(meta['id'] == binding.file_id and not meta.get('trashed') and meta.get('parents') == [binding.folder_id] and meta.get('mimeType') == 'application/json', 'state_binding_invalid')
                  raw = self.request('GET', base + '?supportsAllDrives=true&alt=media', self.token)
                  require(hashlib.md5(raw).hexdigest() == meta.get('md5Checksum') and len(raw) == int(meta['size']), 'state_changed')
                  return validator(raw,binding), (hashlib.sha256(raw).hexdigest(),meta)

          def load_policy(root, expected_sheet):
              from app.aupay_card_batch import ProtectedRecurringAuthorityProvider
              try:
                  raw = json.loads(os.environ['AUPAY_CARD_RECURRING_AUTHORITY_JSON'])
                  require(isinstance(raw,dict), 'authority_json_invalid')
                  require(raw.get('expected_worksheet','取込データ') == '取込データ', 'worksheet_mismatch')
                  w,o = raw.get('max_window_seconds'),raw.get('overlap_seconds')
                  require(type(w) is int and type(o) is int and o >= 0 and w > o, 'window_stride_invalid')
                  require(raw.get('source') == 'au_pay_card_gmail', 'source_mismatch')
                  require(raw.get('expected_spreadsheet_id') == expected_sheet, 'spreadsheet_mismatch')
                  with tempfile.TemporaryDirectory(prefix='card-authority-',dir='/dev/shm') as td:
                      path = Path(td)/'authority.json'
                      with os.fdopen(os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600),'w') as f:
                          f.write(os.environ['AUPAY_CARD_RECURRING_AUTHORITY_JSON'])
                      policy = ProtectedRecurringAuthorityProvider(path,repo_root=root).load()
                  require(policy.expected_worksheet == '取込データ', 'worksheet_mismatch')
                  return policy
              except Stop:
                  raise
              except (KeyError,ValueError,TypeError):
                  raise Stop('authority_json_invalid') from None
              except Exception:
                  raise Stop('authority_policy_invalid') from None

          def checkpoint(value):
              require(value['phase']=='ready' and not value['attempt'], 'state_pending')
              cps=[]
              for name,item in value['files'].items():
                  if not name.endswith('.sqlite3'):
                      continue
                  con=sqlite3.connect(':memory:')
                  try:
                      con.deserialize(base64.b64decode(item['data'],validate=True))
                      con.execute('PRAGMA trusted_schema=OFF');con.execute('PRAGMA query_only=ON')
                      tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                      if 'recurring_checkpoint' in tables:
                          rows=con.execute('SELECT successful_window_end,run_id FROM recurring_checkpoint WHERE singleton=1').fetchall()
                          require(len(rows)==1,'checkpoint_invalid')
                          cp,rid=rows[0]
                          last=con.execute('SELECT status,window_end FROM recurring_runs WHERE run_id=?',(rid,)).fetchone()
                          require(last and last[0] in ('noop','complete') and last[1]==cp,'checkpoint_invalid')
                          cps.append(datetime.fromisoformat(cp))
                      if 'writer_leases' in tables:
                          require(con.execute('SELECT COUNT(*) FROM writer_leases').fetchone()[0]==0,'native_pending')
                      for table in ('batch_capabilities','production_capabilities'):
                          if table in tables:
                              require(con.execute('SELECT COUNT(*) FROM '+table+" WHERE state!='sealed'").fetchone()[0]==0,'native_pending')
                      for table,fields in [('batch_events',('run_id','attempt_id')),('journal_events',('run_id','canonical_identity','attempt_id'))]:
                          if table in tables:
                              cur=con.execute('SELECT * FROM '+table+' ORDER BY seq')
                              rows=[dict(zip([d[0] for d in cur.description],r)) for r in cur]
                              latest={tuple(r[k] for k in fields):r for r in rows}
                              require(all(r['stage']=='final' and r['state'] in ('confirmed','write_confirmed') for r in latest.values()),'native_pending')
                  finally:
                      con.close()
              require(len(cps)==1 and cps[0].tzinfo is not None,'checkpoint_invalid')
              return cps[0]

          def inspect():
              root=Path(os.environ['GITHUB_WORKSPACE']).resolve()
              sys.path.insert(0,str(root))
              from app.aupay_card_recurring import build_incremental_window
              from app.private_state_bindings import unwrap
              from app.drive_run_state import StateBinding,validate
              from app.production_ledger import validate_ledger
              net=ReadNetwork();net.controls()
              expected=os.environ['SPREADSHEET_ID']
              policy=load_policy(root,expected)
              now=datetime.now(timezone(timedelta(hours=9))).replace(microsecond=0)
              require(policy.valid_from<=now<policy.expires_at,'authority_period_inactive')
              info=json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'])
              decoded={n:unwrap(n,os.environ[n],info['private_key']) for n in ('KAKEIBO_STATE_FOLDER_ID','AUPAY_CARD_STATE_FILE_ID','KAKEIBO_RUN_LEDGER_FILE_ID')}
              card=StateBinding('au_pay_card_gmail',expected,decoded['KAKEIBO_STATE_FOLDER_ID'],decoded['AUPAY_CARD_STATE_FILE_ID'])
              parent=StateBinding('production_run',expected,decoded['KAKEIBO_STATE_FOLDER_ID'],decoded['KAKEIBO_RUN_LEDGER_FILE_ID'])
              net.google(info,expected,[card.file_id,parent.file_id])
              titles=net.json('GET',net.sheet_url,net.token)
              require(any(s['properties']['title']=='取込データ' for s in titles['sheets']),'target_worksheet_missing')
              cv,cb=net.state(card,validate);pv,pb=net.state(parent,validate_ledger)
              require(all(x['phase']=='ready' and not x['attempt'] and not x['error'] for x in pv['sources'].values()),'state_pending')
              require(pv['sources']['amazon']['counts'].get('catch_up_pending')==0,'state_pending')
              cp=checkpoint(cv);require(cp<=now,'checkpoint_invalid')
              start=cp-timedelta(seconds=policy.overlap_seconds)
              outcome='within_authority'
              try:
                  window=build_incremental_window(policy,SimpleNamespace(successful_window_end=lambda:cp),now)
                  require(window.start==start and window.end==now,'checkpoint_invalid')
              except RuntimeError as e:
                  if str(e)!='incremental_window_exceeds_authority':
                      raise Stop('inspection_failed') from None
                  outcome='exceeds_authority'
              _,ca=net.state(card,validate);_,pa=net.state(parent,validate_ledger)
              require(cb==ca and pb==pa,'state_changed')
              net.controls()
              seconds=int((now-start).total_seconds())
              stride=policy.max_window_seconds-policy.overlap_seconds
              elapsed=max(0,int((now-cp).total_seconds()))
              return dict(success=True,outcome=outcome,observed_at=now.isoformat(),authority_origin='Actions repository secret AUPAY_CARD_RECURRING_AUTHORITY_JSON',source_matches=True,spreadsheet_matches=True,worksheet_matches=True,period_active=True,valid_from=policy.valid_from.isoformat(),expires_at=policy.expires_at.isoformat(),overlap_seconds=policy.overlap_seconds,max_window_seconds=policy.max_window_seconds,max_messages=policy.max_messages,max_batch_size=policy.max_batch_size,checkpoint=cp.isoformat(),required_start=start.isoformat(),required_end=now.isoformat(),required_seconds=seconds,excess_seconds=max(0,seconds-policy.max_window_seconds),estimated_windows=max(1,(elapsed+stride-1)//stride),state_unchanged=True,gmail_requests=0,financial_write_requests=0,source_executions=0,preview_executions=0)

          def main():
              def timeout_handler(*_):
                  raise Stop('timeout')
              signal.signal(signal.SIGALRM,timeout_handler);signal.signal(signal.SIGTERM,timeout_handler)
              signal.alarm(120)
              try:
                  # Suppress dependency output, raw tracebacks, warnings and exception payloads.
                  with contextlib.redirect_stdout(io.StringIO()),contextlib.redirect_stderr(io.StringIO()):
                      if len(sys.argv)==2 and sys.argv[1]=='guard':
                          ReadNetwork().controls();result=dict(success=True,guard=True)
                      else:
                          result=inspect()
                  signal.alarm(0)
                  print(json.dumps(result,ensure_ascii=True,sort_keys=True));return 0
              except Exception as e:
                  reason=str(e) if type(e) is Stop and str(e) in FAILURES else 'inspection_failed'
                  print(json.dumps(dict(success=False,reason=reason,no_retry=True),sort_keys=True));return 1

          if __name__=='__main__':
              raise SystemExit(main())
          PY
          cat > "$RUNNER_TEMP/card-authority-readonly.lock" <<'LOCK'
