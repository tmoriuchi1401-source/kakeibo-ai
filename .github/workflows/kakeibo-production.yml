name: Kakeibo unified production

on:
  schedule:
    - cron: '17 9,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview by default; apply uses existing source authorities
        type: choice
        options: [preview, apply]
        default: preview
        required: true
      confirm:
        description: Type APPLY only after approving this production run
        type: string
        required: false
      scope:
        description: All stages or isolated receipts, receipt review, or Amazon canary
        type: choice
        options: [all, amazon_canary, receipt_reimport, receipt_confirmation, receipts, projection, daily, ledger_order, categories]
        default: all
        required: true
      amazon_target:
        description: RSA-wrapped fixed AM money ID; only for canary apply
        type: string
        required: false
      canary_source:
        description: Confirmed-money authority used by amazon_canary
        type: choice
        options: [amazon, aupay_card]
        default: amazon
        required: false
      projection_bootstrap:
        description: Rebuild derived indexes/months from the ledger in isolated projection scope
        type: boolean
        default: false
      bank_apply:
        description: Separate approved bank apply (schedule always previews bank)
        type: boolean
        default: false
        required: true
      receipt_store:
        description: RSA-wrapped separate private receipt result file ID
        type: string
        required: false
      receipt_manifest:
        description: SHA256 of the approved fixed normal receipt manifest
        type: string
        required: false
      receipt_operation:
        description: Reanalyze new fixed targets or compare saved results without AI
        type: choice
        options: [reanalyze, replay]
        default: reanalyze
      receipt_limit:
        description: Maximum new fixed receipts per run; first run uses one
        type: choice
        options: ['1', '2', '3']
        default: '1'

permissions:
  contents: read

concurrency:
  group: kakeibo-production
  cancel-in-progress: false
  queue: max

jobs:
  production:
    # Unset variables disable the entire job before any production Secret is used.
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.ref == 'refs/heads/main' &&
      vars.KAKEIBO_PRODUCTION_ENABLED == 'true' &&
      vars.KAKEIBO_LEGACY_DISABLED == 'true' &&
      (github.event_name != 'schedule' || vars.KAKEIBO_SCHEDULE_ENABLED == 'true') &&
      github.sha == vars.KAKEIBO_VALIDATED_MAIN_SHA
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAKEIBO_PRODUCTION_ENABLED: ${{ vars.KAKEIBO_PRODUCTION_ENABLED }}
      KAKEIBO_VALIDATED_MAIN_SHA: ${{ vars.KAKEIBO_VALIDATED_MAIN_SHA }}
      KAKEIBO_PROJECTION_FOLDER_ID: ${{ vars.KAKEIBO_PROJECTION_FOLDER_ID }}
      KAKEIBO_DAILY_SPREADSHEET_ID: ${{ vars.KAKEIBO_DAILY_SPREADSHEET_ID }}
      KAKEIBO_DAILY_CORRECTIONS_MODE: ${{ vars.KAKEIBO_DAILY_CORRECTIONS_MODE }}
      KAKEIBO_AMAZON_MONEY_MODE: ${{ vars.KAKEIBO_AMAZON_MONEY_MODE }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_GMAIL_TOKEN_JSON: ${{ secrets.GOOGLE_GMAIL_TOKEN_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      # Normal receipts only: verified text/image availability, separate model quota.
      NORMAL_RECEIPT_GEMINI_MODEL: gemini-3.5-flash-lite
      KAKEIBO_LOCAL_OCR_ENABLED: 'true'
      # Owner rule: unruled receipt images may enter ordinary Gemini extraction.
      RECEIPT_UNRULED_POLICY: owner-unruled-v1
      KAKEIBO_OCR_MODEL_DIR: /tmp/kakeibo-ocr-models
      RECEIPT_DRIVE_FOLDER_ID: ${{ secrets.RECEIPT_DRIVE_FOLDER_ID }}
      PROCESSED_DRIVE_FOLDER_ID: ${{ secrets.PROCESSED_DRIVE_FOLDER_ID }}
      PAYPAY_DRIVE_FOLDER_ID: ${{ secrets.PAYPAY_DRIVE_FOLDER_ID }}
      AUPAY_GMAIL_QUERY: ${{ vars.AUPAY_GMAIL_QUERY }}
      AUPAY_CARD_AUDIT_KEY_JSON: ${{ secrets.AUPAY_CARD_AUDIT_KEY_JSON }}
      AUPAY_CARD_RECURRING_AUTHORITY_JSON: ${{ secrets.AUPAY_CARD_RECURRING_AUTHORITY_JSON }}
      BANK_PDF_DRIVE_FOLDER_ID: ${{ secrets.BANK_PDF_DRIVE_FOLDER_ID }}
      BANK_PDF_RECURRING_AUTHORITY_JSON: ${{ secrets.BANK_PDF_RECURRING_AUTHORITY_JSON }}
      BANK_INCOME_WRITE_ENABLED: ${{ vars.BANK_INCOME_WRITE_ENABLED || 'false' }}
      BANK_AUDIT_KEY_JSON: ${{ secrets.BANK_AUDIT_KEY_JSON }}
      BANK_CONFIRMED_INTERNAL_TRANSFERS_JSON: ${{ secrets.BANK_CONFIRMED_INTERNAL_TRANSFERS_JSON }}
      BANK_CONFIRMED_NON_OWN_CLASSIFICATIONS_JSON: ${{ secrets.BANK_CONFIRMED_NON_OWN_CLASSIFICATIONS_JSON }}
      BANK_CONFIRMED_DOCOMO_SMTB_RULES_JSON: ${{ secrets.BANK_CONFIRMED_DOCOMO_SMTB_RULES_JSON }}
      CATEGORY_RULE_AUTO_APPLY_ENABLED: ${{ vars.CATEGORY_RULE_AUTO_APPLY_ENABLED }}
      CATEGORY_RULE_UI_ENABLED: ${{ vars.CATEGORY_RULE_UI_ENABLED }}
      CATEGORY_RULE_SAVE_ENABLED: ${{ vars.CATEGORY_RULE_SAVE_ENABLED }}
      CATEGORY_BACKFILL_PREVIEW_ENABLED: ${{ vars.CATEGORY_BACKFILL_PREVIEW_ENABLED }}
      CATEGORY_BACKFILL_APPLY_ENABLED: ${{ vars.CATEGORY_BACKFILL_APPLY_ENABLED }}
      # Values are RSA-wrapped fixed IDs, decrypted only inside Python.
      KAKEIBO_STATE_FOLDER_ID: ${{ vars.KAKEIBO_STATE_FOLDER_ID }}
      AMAZON_STATE_FILE_ID: ${{ vars.AMAZON_STATE_FILE_ID }}
      AUPAY_CARD_STATE_FILE_ID: ${{ vars.AUPAY_CARD_STATE_FILE_ID }}
      BANK_STATE_FILE_ID: ${{ vars.BANK_STATE_FILE_ID }}
      KAKEIBO_RUN_LEDGER_FILE_ID: ${{ vars.KAKEIBO_RUN_LEDGER_FILE_ID }}
      # Dedicated review store: encrypted ID plus pinned existing manifest hash.
      RECEIPT_CONFIRMATION_BINDING: ${{ vars.RECEIPT_CONFIRMATION_BINDING }}
      # Unset until the service plan/terms and derived-only policy are verified.
      MEDICAL_DERIVED_AI_POLICY: ${{ vars.MEDICAL_DERIVED_AI_POLICY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch main's tracking ref for the existing bank branch/upstream guard.
          # The next step rejects any movement away from the approved event SHA.
          ref: main
          persist-credentials: false
      - name: Bind verified checkout for existing bank main guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KAKEIBO_VALIDATED_MAIN_SHA"
          if git show-ref --verify --quiet refs/heads/main; then
            test "$(git rev-parse main)" = "$GITHUB_SHA"
          else
            git branch main "$GITHUB_SHA"
          fi
          git switch main
          git branch --set-upstream-to=origin/main main
      - name: Require normal logging before private bindings
        if: ${{ runner.debug == '1' }}
        run: exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install existing OCR runtime
        if: ${{ inputs.scope != 'projection' && inputs.scope != 'daily' && inputs.scope != 'amazon_canary' && inputs.scope != 'ledger_order' && inputs.scope != 'categories' }}
        run: |
          pip install -r requirements-local-ocr.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-jpn
          tesseract --list-langs | grep -qx jpn
          tesseract --list-langs | grep -qx eng
          python -m app.receipt_local_ocr prepare
      - name: Execute sources and dependent accounting serially
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode || 'preview' }}
          MANUAL_SCOPE: ${{ inputs.scope || 'all' }}
          AMAZON_TARGET: ${{ inputs.amazon_target }}
          CANARY_SOURCE: ${{ inputs.canary_source || 'amazon' }}
          PROJECTION_BOOTSTRAP: ${{ inputs.projection_bootstrap || false }}
          CONFIRM: ${{ inputs.confirm }}
          BANK_APPLY: ${{ inputs.bank_apply || false }}
          RECEIPT_STORE: ${{ inputs.receipt_store }}
          RECEIPT_MANIFEST: ${{ inputs.receipt_manifest }}
          RECEIPT_OPERATION: ${{ inputs.receipt_operation || 'reanalyze' }}
          RECEIPT_LIMIT: ${{ inputs.receipt_limit || '1' }}
        run: |
          set -euo pipefail
          mode=preview
          args=()
          if [[ "$EVENT_NAME" == schedule ]]; then
            mode=apply
          else
            args+=(--scope "$MANUAL_SCOPE")
            args+=(--canary-source "$CANARY_SOURCE")
            if [[ "$PROJECTION_BOOTSTRAP" == true ]]; then args+=(--projection-bootstrap); fi
            if [[ "$MANUAL_SCOPE" == receipt_reimport ]]; then
              args+=(--receipt-store "$RECEIPT_STORE" --receipt-manifest "$RECEIPT_MANIFEST")
              args+=(--receipt-operation "$RECEIPT_OPERATION" --receipt-limit "$RECEIPT_LIMIT")
            fi
            if [[ -n "$AMAZON_TARGET" ]]; then args+=(--amazon-target "$AMAZON_TARGET"); fi
            if [[ "$MANUAL_MODE" == apply ]]; then
              test "$CONFIRM" = APPLY || { echo 'Apply confirmation required'; exit 1; }
              mode=apply
              if [[ "$BANK_APPLY" == true ]]; then args+=(--bank-apply); fi
            elif [[ "$BANK_APPLY" == true ]]; then
              echo 'Bank apply requires approved apply mode'
              exit 1
            fi
          fi
          python -m app.production_flow --mode "$mode" "${args[@]}"
