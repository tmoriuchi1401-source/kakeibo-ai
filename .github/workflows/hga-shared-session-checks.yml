name: Shared Google session contracts
on:
  pull_request:
    branches: [main]
    paths: ['auth-session/**', 'app/receipt_plan/drive.py', '.github/workflows/hga-shared-session-checks.yml']
  push:
    branches: [main]
    paths: ['auth-session/**', 'app/receipt_plan/drive.py', '.github/workflows/hga-shared-session-checks.yml']
permissions:
  contents: read
jobs:
  shared-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline contract dependencies
        run: pip install -r requirements-test.txt Flask==3.1.3 google-cloud-firestore==2.34.0
      - name: Test hash-pinned existing service plus session delta (no production secrets)
        run: python auth-session/compose.py --test
      - name: Verify deployable whitelist without deploying
        run: python auth-session/compose.py --output /tmp/hga-session-container
