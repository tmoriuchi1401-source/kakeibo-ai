name: iPhone Sheets adapter offline checks

on:
  pull_request:
    branches: [codex/iphone-one-tab-safety]

permissions:
  contents: read

env:
  UNIFIED_RECEIPT_WRITE_ENABLED: 'false'

concurrency:
  group: kakeibo-iphone-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: pip install -r requirements-test.txt
      - name: Collect and run raw reader, persistent CAS and native dry-run
        run: |
          python -m pytest --collect-only -q tests/test_iphone_sheet_reader.py tests/test_iphone_draft_journal.py tests/test_iphone_native_dry_run.py
          python -m pytest -vv tests/test_iphone_sheet_reader.py tests/test_iphone_draft_journal.py tests/test_iphone_native_dry_run.py
      - name: Reuse existing safety boundaries
        run: python -m pytest -q tests/test_iphone_review_drafts.py tests/test_iphone_review_preview.py tests/test_unified_receipt_review.py tests/test_unified_receipt_eligibility.py tests/test_unified_receipt_write.py tests/test_unified_receipt_purposes.py tests/test_unified_receipt_shadow_host.py tests/test_production_workflows.py
      - name: Compile and check whitespace
        run: |
          python -m compileall -q app/iphone_sheet_reader.py app/iphone_draft_journal.py app/iphone_native_dry_run.py tests/test_iphone_sheet_reader.py tests/test_iphone_draft_journal.py tests/test_iphone_native_dry_run.py
          git diff --check
