name: iPhone synthetic handoff UI
on:
  pull_request:
    branches: [codex/iphone-one-tab-draft-handoff]
permissions:
  contents: read
env:
  UNIFIED_RECEIPT_WRITE_ENABLED: 'false'
concurrency:
  group: kakeibo-sheet-handoff-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install synthetic test dependencies
        run: |
          pip install -r requirements-test.txt playwright==1.64.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Existing adapter and authenticated UI contracts
        run: python -m pytest -q tests/test_iphone_sheet_handoff.py tests/test_iphone_sheet_handoff_host.py tests/test_iphone_handoff_ui.py --junitxml=.private/handoff-ui-host.xml
      - name: PC and 390px actual browser with OS egress isolation
        run: |
          for tool in unshare ip runuser sudo; do command -v "$tool" >/dev/null; done
          task_user=$(id -un)
          task_python=$(command -v python)
          task_netns=$(readlink /proc/self/ns/net)
          sudo unshare --net -- sh -eu -c '
            ip link set lo up
            exec runuser -u "$1" -- env HANDOFF_OUTER_NETNS="$3" "$2" -m pytest -q tests/test_iphone_handoff_browser.py --junitxml=.private/handoff-ui-browser.xml
          ' sh "$task_user" "$task_python" "$task_netns"
      - name: Existing one-tab screen and input safety regressions
        run: python -m pytest -q tests/test_iphone_sheet_reader.py tests/test_iphone_draft_journal.py tests/test_iphone_persistent_drafts.py tests/test_iphone_source_observation.py tests/test_iphone_item_drafts.py tests/test_iphone_review_drafts.py tests/test_iphone_confirmation.py tests/test_production_workflows.py tests/test_iphone_r1_adapter.py::test_save_returns_exact_readback_revision_tag_and_replay_metadata tests/test_iphone_r1_confirmation.py::test_partial_save_and_medical_origin_block tests/test_iphone_r1_confirmation.py::test_holds_have_no_qualification --junitxml=.private/handoff-ui-regression.xml
      - name: Script syntax compile and whitespace
        run: |
          node --check app/unified_shadow_templates/iphone_sheet_handoff.js
          python -m compileall -q app/iphone_sheet_handoff_host.py tests/test_iphone_handoff_ui.py tests/test_iphone_handoff_browser.py
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-ui-synthetic-evidence
          path: |
            .private/handoff-ui-*.xml
            .private/handoff-ui/*.png
            .private/handoff-ui/*-evidence.json
          include-hidden-files: true
          retention-days: 7
