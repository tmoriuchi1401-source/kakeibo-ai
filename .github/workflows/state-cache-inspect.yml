name: Inspect legacy state cache

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only cache inspection before stopping any legacy entry
        type: choice
        options: [inspect, card-pending-evidence]
        default: inspect
        required: true
      expected_sha:
        description: Exact Linux-tested main commit
        type: string
        required: true
      amazon_key:
        description: Exact amazon-production-state-run_id-attempt cache key
        type: string
        required: true
      card_key:
        description: Exact aupay-card-production-state-run_id-attempt cache key
        type: string
        required: true
      bank_key:
        description: Exact bank-pdf-recurring-state-run_id-attempt cache key
        type: string
        required: true
      receipt_e2e_phase:
        description: Isolated receipt connection only; no financial write or real AI
        type: choice
        required: false
        default: none
        options: [none, auth, preflight, intake, process, restore, unknown-create, unknown-restore]

permissions:
  contents: read
  actions: read

concurrency:
  group: kakeibo-production
  cancel-in-progress: false
  queue: max

jobs:
  card-pending-evidence:
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/receipt-canary-resume' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 && github.sha == inputs.expected_sha &&
      inputs.operation == 'card-pending-evidence' && inputs.receipt_e2e_phase == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject debug before credentials
        if: ${{ runner.debug == '1' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dependencies before credentials
        run: pip install -r requirements.txt
      - name: Read fixed failed-card evidence without writer capability
        env:
          CARD_EVIDENCE_SHA: ${{ inputs.expected_sha }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_GMAIL_TOKEN_JSON: ${{ secrets.GOOGLE_GMAIL_TOKEN_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          KAKEIBO_STATE_FOLDER_ID: ${{ vars.KAKEIBO_STATE_FOLDER_ID }}
          AUPAY_CARD_STATE_FILE_ID: ${{ vars.AUPAY_CARD_STATE_FILE_ID }}
          KAKEIBO_RUN_LEDGER_FILE_ID: ${{ vars.KAKEIBO_RUN_LEDGER_FILE_ID }}
        run: python -m app.card_pending_readonly
  receipt-isolated-e2e:
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/issue-207-hosted-receipts' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 && github.sha == inputs.expected_sha &&
      contains(fromJSON('["auth","preflight","intake","process","restore","unknown-create","unknown-restore"]'), inputs.receipt_e2e_phase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject debug before credentials
        if: ${{ runner.debug == '1' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing dependencies before credentials
        run: pip install -r requirements.txt
      - name: Execute fixed synthetic phase without financial or AI capability
        env:
          E2E_PHASE: ${{ inputs.receipt_e2e_phase }}
          E2E_EXPECTED_SHA: ${{ inputs.expected_sha }}
          GOOGLE_RECEIPT_OWNER_TOKEN_JSON: ${{ secrets.GOOGLE_RECEIPT_E2E_OWNER_TOKEN_JSON }}
          RECEIPT_HOSTED_REVIEW_BINDING: ${{ inputs.receipt_e2e_phase != 'auth' && vars.RECEIPT_HOSTED_E2E_REVIEW_BINDING || '' }}
          RECEIPT_HOSTED_E2E_CONFIG_JSON: ${{ inputs.receipt_e2e_phase != 'auth' && secrets.RECEIPT_HOSTED_E2E_CONFIG_JSON || '' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ inputs.receipt_e2e_phase != 'auth' && secrets.GOOGLE_SERVICE_ACCOUNT_JSON || '' }}
          SPREADSHEET_ID: ${{ inputs.receipt_e2e_phase != 'auth' && secrets.SPREADSHEET_ID || '' }}
          RECEIPT_DRIVE_FOLDER_ID: ${{ inputs.receipt_e2e_phase != 'auth' && secrets.RECEIPT_DRIVE_FOLDER_ID || '' }}
          PROCESSED_DRIVE_FOLDER_ID: ${{ inputs.receipt_e2e_phase != 'auth' && secrets.PROCESSED_DRIVE_FOLDER_ID || '' }}
          KAKEIBO_STATE_FOLDER_ID: ${{ inputs.receipt_e2e_phase != 'auth' && vars.KAKEIBO_STATE_FOLDER_ID || '' }}
          AMAZON_STATE_FILE_ID: ${{ inputs.receipt_e2e_phase != 'auth' && vars.AMAZON_STATE_FILE_ID || '' }}
          AUPAY_CARD_STATE_FILE_ID: ${{ inputs.receipt_e2e_phase != 'auth' && vars.AUPAY_CARD_STATE_FILE_ID || '' }}
          BANK_STATE_FILE_ID: ${{ inputs.receipt_e2e_phase != 'auth' && vars.BANK_STATE_FILE_ID || '' }}
          KAKEIBO_RUN_LEDGER_FILE_ID: ${{ inputs.receipt_e2e_phase != 'auth' && vars.KAKEIBO_RUN_LEDGER_FILE_ID || '' }}
          RECEIPT_CONFIRMATION_BINDING: ${{ inputs.receipt_e2e_phase != 'auth' && vars.RECEIPT_CONFIRMATION_BINDING || '' }}
        run: python -m app.receipt_hosted_e2e
  inspect:
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'inspect' &&
      github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deliberately no production Secrets, Drive IDs, binding, upload or cache save.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout and latest completed source runs
        uses: actions/github-script@v7
        env:
          AMAZON_KEY: ${{ inputs.amazon_key }}
          CARD_KEY: ${{ inputs.card_key }}
          BANK_KEY: ${{ inputs.bank_key }}
        with:
          script: |
            const sources = [
              ['amazon-daily-import.yml', 'amazon-production-state', process.env.AMAZON_KEY],
              ['aupay-card-recurring-production.yml', 'aupay-card-production-state', process.env.CARD_KEY],
              ['bank-pdf-recurring.yml', 'bank-pdf-recurring-state', process.env.BANK_KEY],
            ];
            const main = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (main.data.commit.sha !== context.sha) throw new Error('maintenance_main_moved');
            for (const [workflow_id, prefix, key] of sources) {
              const match = new RegExp('^' + prefix + '-([1-9][0-9]*)-([1-9][0-9]*)$').exec(key);
              if (!match) throw new Error('cache_reference_invalid');
              const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id, branch: 'main', per_page: 1});
              const latest = runs.data.workflow_runs[0];
              if (!latest || String(latest.id) !== match[1] || String(latest.run_attempt) !== match[2]
                  || latest.status !== 'completed' || latest.conclusion !== 'success') {
                throw new Error('latest_source_run_not_confirmed');
              }
            }
            core.info('Latest run/attempt references confirmed; inspection only, not final migration sources.');
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact Amazon cache
        id: amazon
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/amazon-production-state
          key: ${{ inputs.amazon_key }}
          fail-on-cache-miss: true
      - name: Restore exact card cache
        id: card
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/aupay-card-production-state
          key: ${{ inputs.card_key }}
          fail-on-cache-miss: true
      - name: Restore exact bank cache
        id: bank
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bank-pdf-recurring-state
          key: ${{ inputs.bank_key }}
          fail-on-cache-miss: true
      - name: Require exact hits and inspect isolated copies
        env:
          AMAZON_EXACT: ${{ steps.amazon.outputs.cache-hit == 'true' && steps.amazon.outputs.cache-matched-key == inputs.amazon_key }}
          CARD_EXACT: ${{ steps.card.outputs.cache-hit == 'true' && steps.card.outputs.cache-matched-key == inputs.card_key }}
          BANK_EXACT: ${{ steps.bank.outputs.cache-hit == 'true' && steps.bank.outputs.cache-matched-key == inputs.bank_key }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AMAZON_EXACT" = true
          test "$CARD_EXACT" = true
          test "$BANK_EXACT" = true
          python -m app.state_cache_inspect --runner-temp "$RUNNER_TEMP"
