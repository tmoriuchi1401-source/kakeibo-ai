name: au PAY card first-window Preview only

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed deployed main SHA (must equal validated and workflow SHA)
        type: string
        required: true
      source:
        type: choice
        options: [au_pay_card_gmail]
        default: au_pay_card_gmail
        required: true
      window_start:
        description: Fixed first-window start in JST
        type: string
        default: '2026-10-13T08:55:56+09:00'
        required: true
      window_end:
        description: Fixed first-window end in JST (exclusive)
        type: string
        default: '2026-10-27T08:55:56+09:00'
        required: true
      expected_checkpoint:
        type: string
        default: '2026-10-15T08:55:56+09:00'
        required: true
      confirm:
        description: Type PREVIEW_ONLY; no Apply option exists
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: kakeibo-production
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 && inputs.confirm == 'PREVIEW_ONLY' &&
      github.sha == inputs.expected_commit && github.sha == github.workflow_sha &&
      github.sha == vars.KAKEIBO_VALIDATED_MAIN_SHA &&
      vars.KAKEIBO_PRODUCTION_ENABLED == 'true' && vars.KAKEIBO_LEGACY_DISABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      PREVIEW_SOURCE: ${{ inputs.source }}
      PREVIEW_START: ${{ inputs.window_start }}
      PREVIEW_END: ${{ inputs.window_end }}
      EXPECTED_CHECKPOINT: ${{ inputs.expected_checkpoint }}
      CONFIRM: ${{ inputs.confirm }}
      KAKEIBO_VALIDATED_MAIN_SHA: ${{ vars.KAKEIBO_VALIDATED_MAIN_SHA }}
      KAKEIBO_PRODUCTION_ENABLED: ${{ vars.KAKEIBO_PRODUCTION_ENABLED }}
      KAKEIBO_LEGACY_DISABLED: ${{ vars.KAKEIBO_LEGACY_DISABLED }}
      KAKEIBO_BANK_SCHEDULE_ENABLED: ${{ vars.KAKEIBO_BANK_SCHEDULE_ENABLED }}
      KAKEIBO_SCHEDULE_ENABLED: ${{ vars.KAKEIBO_SCHEDULE_ENABLED }}
      CATEGORY_BACKFILL_SHEET_RUNNER_ENABLED: ${{ vars.CATEGORY_BACKFILL_SHEET_RUNNER_ENABLED }}
    steps:
      - name: Reject debug logging before credential injection
        if: ${{ runner.debug == '1' }}
        run: exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Live main and run guard with job-start validated and flags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m app.aupay_card_window_preview guard
      - name: Install reviewed hash-pinned wheels before Google credentials
        shell: bash
        run: |
          set +x
          set -euo pipefail
          python -m pip download --require-hashes --only-binary=:all: -r requirements-card-preview.lock -d "$RUNNER_TEMP/card-wheels"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/card-wheels" --require-hashes -r requirements-card-preview.lock
          python -m pip check
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: One card Preview and independent read-only before-after checks
        env:
          GH_TOKEN: ${{ github.token }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_GMAIL_TOKEN_JSON: ${{ secrets.GOOGLE_GMAIL_TOKEN_JSON }}
          AUPAY_CARD_AUDIT_KEY_JSON: ${{ secrets.AUPAY_CARD_AUDIT_KEY_JSON }}
          AUPAY_CARD_RECURRING_AUTHORITY_JSON: ${{ secrets.AUPAY_CARD_RECURRING_AUTHORITY_JSON }}
          KAKEIBO_STATE_FOLDER_ID: ${{ vars.KAKEIBO_STATE_FOLDER_ID }}
          AUPAY_CARD_STATE_FILE_ID: ${{ vars.AUPAY_CARD_STATE_FILE_ID }}
          KAKEIBO_RUN_LEDGER_FILE_ID: ${{ vars.KAKEIBO_RUN_LEDGER_FILE_ID }}
          KAKEIBO_PROJECTION_FOLDER_ID: ${{ vars.KAKEIBO_PROJECTION_FOLDER_ID }}
          KAKEIBO_AMAZON_MONEY_MODE: ${{ vars.KAKEIBO_AMAZON_MONEY_MODE }}
          CATEGORY_RULE_AUTO_APPLY_ENABLED: ${{ vars.CATEGORY_RULE_AUTO_APPLY_ENABLED }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          python -B -m app.aupay_card_window_preview
