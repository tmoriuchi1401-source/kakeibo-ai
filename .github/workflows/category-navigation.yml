name: Category navigation UI maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify or maintain installed inline summaries without accounting writes
        type: choice
        options: [inline-preview, inline-refresh]
        default: inline-preview
        required: true
      audit_sheet_id:
        description: Optional native sheet ID for a read-only reference audit
        type: string
        default: ''

permissions:
  contents: read

# Share the existing writer lock, without invoking any finance pipeline.
concurrency:
  group: kakeibo-production
  cancel-in-progress: false
  queue: max

jobs:
  navigation:
    if: >-
      github.repository == 'tmoriuchi1401-source/kakeibo-ai' &&
      github.ref == 'refs/heads/main' &&
      vars.KAKEIBO_PRODUCTION_ENABLED == 'true' &&
      vars.KAKEIBO_LEGACY_DISABLED == 'true' &&
      github.sha == vars.KAKEIBO_VALIDATED_MAIN_SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_SHA: ${{ github.sha }}
      KAKEIBO_PRODUCTION_ENABLED: ${{ vars.KAKEIBO_PRODUCTION_ENABLED }}
      KAKEIBO_VALIDATED_MAIN_SHA: ${{ vars.KAKEIBO_VALIDATED_MAIN_SHA }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify and maintain navigation only
        env:
          NAVIGATION_MODE: ${{ inputs.mode }}
          AUDIT_SHEET_ID: ${{ inputs.audit_sheet_id }}
        run: |
          args=()
          if [ -n "$AUDIT_SHEET_ID" ]; then args+=(--audit-sheet-id "$AUDIT_SHEET_ID"); fi
          python -m app.category_navigation_maintenance --mode "$NAVIGATION_MODE" "${args[@]}"
