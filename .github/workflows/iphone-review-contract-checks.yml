name: iPhone one-tab offline contracts

on:
  pull_request:
    branches: [codex/unified-receipt-write-bridge]

permissions:
  contents: read

env:
  UNIFIED_RECEIPT_WRITE_ENABLED: 'false'

concurrency:
  group: kakeibo-iphone-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: pip install -r requirements-test.txt
      - name: Collect and execute new one-tab contracts
        run: |
          python -m pytest --collect-only -q tests/test_iphone_review_drafts.py tests/test_iphone_review_preview.py
          python -m pytest -vv tests/test_iphone_review_drafts.py tests/test_iphone_review_preview.py
      - name: Reuse native identity, purpose, replay and authenticated host contracts
        run: python -m pytest -q tests/test_unified_receipt_review.py tests/test_unified_receipt_eligibility.py tests/test_unified_receipt_write.py tests/test_unified_receipt_purposes.py tests/test_unified_receipt_shadow_host.py tests/test_production_workflows.py
      - name: Compile and check whitespace
        run: |
          python -m compileall -q app/iphone_review_drafts.py app/iphone_review_preview.py tests/test_iphone_review_drafts.py tests/test_iphone_review_preview.py
          git diff --check
