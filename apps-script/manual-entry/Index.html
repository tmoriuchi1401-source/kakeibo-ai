<!doctype html><html lang="ja"><head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>
:root{font-family:system-ui,sans-serif;color:#172b24;background:#f5f7f4}body{margin:0;padding:20px 16px 48px}main{max-width:480px;margin:auto}h1{font-size:1.4rem;margin:8px 0 22px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 3px 16px #172b2412}label{display:block;margin-top:17px;font-weight:600}input,select{box-sizing:border-box;width:100%;font:inherit;margin-top:7px;padding:13px;border:1px solid #bfcfc7;border-radius:11px;background:white;color:#172b24}#amount{font-size:2rem;font-weight:700}button{font:inherit;border:0;border-radius:12px;padding:14px;cursor:pointer}#save{background:#12684b;color:white;width:100%;font-weight:bold;margin-top:24px}button:disabled{opacity:.45}#undo{background:#e9f1ec;color:#12684b;margin-top:12px}#notice{min-height:2em;margin-top:16px;line-height:1.5}small{display:block;color:#53645c;margin-top:5px}</style></head><body><main><h1>家計簿 手入力</h1><div class="card"><label for="amount">金額（円）</label><input id="amount" type="number" min="1" max="99999999" step="1" inputmode="numeric" autofocus required placeholder="500"><label for="merchant">内容・店舗 <small>省略できます</small></label><input id="merchant" maxlength="100" placeholder="例：お祭り"><label for="date">日付</label><input id="date" type="date"><label for="major">大カテゴリ <small>選ばなければ未分類で記録します</small></label><select id="major"><option value="">あとで分類</option></select><label for="minor">小カテゴリ</label><select id="minor" disabled><option value="">選択してください</option></select><label for="note">メモ <small>任意</small></label><input id="note" maxlength="300"><small>支払方法：現金</small><button id="save" disabled>登録</button><div id="notice" role="status" aria-live="polite"></div><button id="undo" hidden>この記録を取り消す</button></div></main><script>
let bootstrap, pendingId, cancelId; const $=id=>document.getElementById(id);
const show=message=>$('notice').textContent=message;
const failed=error=>{show(error.message||'通信に失敗しました。入力を残して再確認してください。');$('save').disabled=false};
function options(){const major=$('major').value;const list=bootstrap.categories.filter(pair=>pair[0]===major);$('minor').replaceChildren(new Option(major?'選択してください':'選択してください',''),...list.map(pair=>new Option(pair[1],pair[1])));$('minor').disabled=!major}
$('major').onchange=options;
function refresh(){google.script.run.withSuccessHandler(data=>{bootstrap=data;$('date').value ||= data.today;const majors=[...new Set(data.categories.map(pair=>pair[0]))];$('major').replaceChildren(new Option('あとで分類',''),...majors.map(value=>new Option(value,value)));options();$('save').disabled=false}).withFailureHandler(failed).manualBootstrap()}
$('save').onclick=()=>{if(!bootstrap||!bootstrap.id)return;const amount=$('amount').value;if(!/^\d+$/.test(amount)||Number(amount)<1){show('1円以上の整数を入力してください。');return}if($('major').value&&!$('minor').value){show('小カテゴリを選択してください。');return} $('save').disabled=true;show('受付中…');const id=bootstrap.id;const input={id,amount,date:$('date').value,merchant:$('merchant').value,major:$('major').value,minor:$('minor').value,note:$('note').value};google.script.run.withSuccessHandler(result=>{if(result.state==='dispatch_failed'){show('受付は保存されましたが、処理の起動に失敗しました。管理者に連絡してください。');return}pendingId=id;cancelId=null;$('undo').disabled=false;show('受付済みです。家計簿への反映を待っています。');$('undo').hidden=false;bootstrap.id=null;watch(id)}).withFailureHandler(failed).manualSubmit(input)};
$('undo').onclick=()=>{if(!pendingId)return;$('undo').disabled=true;show('取消を受付中…');cancelId ||= bootstrap.cancelId;google.script.run.withSuccessHandler(result=>{if(result.state==='cancelled'){show('取り消し済みです。');$('undo').hidden=true;reset();return}show(result.state==='dispatch_failed'?'取消の起動に失敗しました。管理者に連絡してください。':'取消を受け付けました。反映を待っています。');if(result.state!=='dispatch_failed')watch(cancelId)}).withFailureHandler(error=>{failed(error);$('undo').disabled=false}).manualCancel(pendingId,cancelId)};
function watch(id){google.script.run.withSuccessHandler(result=>{if(id===cancelId&&result.state==='complete'){show('取り消しました。');$('undo').hidden=true;reset();return}if(id===pendingId&&result.state==='complete'&&!cancelId){show('家計簿に登録しました。');reset();return}if(['error','dispatch_failed','unknown'].includes(result.state)){show('状態を確認できません。管理者に連絡してください。');return}if(id===pendingId&&cancelId)return;setTimeout(()=>watch(id),5000)}).withFailureHandler(()=>setTimeout(()=>watch(id),10000)).manualStatus(id)}
function reset(){if(cancelId){pendingId=null;cancelId=null}$('amount').value='';$('merchant').value='';$('note').value='';$('save').disabled=false;google.script.run.withSuccessHandler(data=>{bootstrap.id=data.id;bootstrap.cancelId=data.cancelId}).manualBootstrap()}
refresh();
</script></body></html>
